name: Build VST3

on:
  push:
  workflow_dispatch:

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: make -C build -j4
      - name: Zip
        run: find build -name \*.vst3 -type d -exec zip -ry Bass-ot-Lehi40-mac-VST3.zip {} \;
      - uses: actions/upload-artifact@v4
        with:
          name: Bass-ot-Lehi40-Mac
          path: Bass-ot-Lehi40-mac-VST3.zip
